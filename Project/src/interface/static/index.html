<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Kick | AI Assistant</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --text: #1e293b;
            --white: #ffffff;
            --border: #e2e8f0;
            --user-msg: #dbeafe;
            --bot-msg: #f1f5f9;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #app { width: 100%; max-width: 1200px; height: 95vh; background: var(--white); border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--border); }
        #header { padding: 20px; background: var(--primary); color: white; text-align: center; font-size: 1.2rem; font-weight: bold; }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; position: relative; white-space: pre-wrap; }
        .user { align-self: flex-end; background: var(--user-msg); color: var(--text); border-bottom-right-radius: 2px; }
        .bot { align-self: flex-start; background: var(--bot-msg); color: var(--text); border-bottom-left-radius: 2px; }
        #input-area { padding: 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; background: var(--white); }
        #user-input { flex: 1; padding: 12px; border: 1px solid var(--border); border-radius: 8px; outline: none; font-size: 1rem; }
        #user-input:focus { border-color: var(--primary); }
        #send-btn { padding: 12px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: opacity 0.2s; }
        #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #file-input { display: none; }
        #upload-btn { padding: 12px; background: #e2e8f0; color: var(--text); border: none; border-radius: 8px; cursor: pointer; font-size: 1.2rem; transition: background 0.2s; }
        #upload-btn:hover { background: #cbd5e1; }
        .file-preview { font-size: 0.8rem; color: #64748b; margin-bottom: 10px; display: none; }
        .loading { font-style: italic; color: #94a3b8; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div id="app">
        <div id="header">Career Kick AI Assistant</div>
        <div id="chat-window"></div>
        <div id="file-preview" class="file-preview">No file selected</div>
        <div id="input-area">
            <button id="upload-btn" title="Upload Resume (PDF)">📎</button>
            <input type="file" id="file-input" accept="application/pdf">
            <input type="text" id="user-input" placeholder="Ask about your resume, jobs, or get in contact with other professionals...">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const fileInput = document.getElementById('file-input');
        const uploadBtn = document.getElementById('upload-btn');
        const filePreview = document.getElementById('file-preview');

        let selectedFile = null;
        let currentResumeId = null;

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = 'message ' + sender;
            div.textContent = text;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function sendWelcomeMessage() {
            const welcomeText = `Hello! Welcome to Career Kick. 🚀

To get started and connect with other professionals, please add yourself to our network! Just send me a message with your:
- Full Name
- Email
- Professional Headline (e.g., 'Full Stack Developer')
- College Major
- Years of Experience

Example: 
- 'My name is Jane Doe, my email is jane@example.com, I'm a Senior Software Engineer, my major was Computer Science, and I have 5 years of experience.'

Disclaimer: 
- You do not need to sign up to use our services

Services:
- Feedback on what's good and bad about your current resume
- Career advice
- Access to other professional profiles with emails to connect
- Access to open job applications`;
            addMessage(welcomeText, 'bot');
        }

        // Initialize the chat with a welcome message
        sendWelcomeMessage();

        uploadBtn.onclick = () => fileInput.click();
        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                selectedFile = file;
                filePreview.style.display = 'block';
                filePreview.textContent = 'Attached: ' + file.name;
            }
        };

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text && !selectedFile) return;

            userInput.value = '';
            const currentFile = selectedFile;
            selectedFile = null;
            filePreview.style.display = 'none';
            fileInput.value = '';

            addMessage(text || "Sent a file", 'user');
            
            const loadingMsg = document.createElement('div');
            loadingMsg.className = 'message bot loading';
            loadingMsg.textContent = 'Assistant is thinking...';
            chatWindow.appendChild(loadingMsg);

            const formData = new FormData();
            formData.append('message', text);
            if (currentFile) formData.append('file', currentFile);
            if (currentResumeId) formData.append('resume_id', currentResumeId);

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                chatWindow.removeChild(loadingMsg);

                if (result.resume_id) {
                    currentResumeId = result.resume_id;
                }

                if (result.status === 'success') {
                    let displayMessage = result.message;
                    if (Array.isArray(result.data) && result.data.length > 0) {
                        const items = result.data.map(item => {
                            if (item.job_title) {
                                return `• ${item.job_title} at ${item.company_name} (${item.location}) — ${item.application_link}`;
                            } else if (item.full_name) {
                                return `• ${item.full_name}: ${item.headline} (${item.major}) — ${item.email}`;
                            }
                            return `• ${JSON.stringify(item)}`;
                        }).join('\n\n');
                        displayMessage += '\n\n' + items;
                    }
                    addMessage(displayMessage, 'bot');
                } else if (result.status === 'incomplete') {
                    addMessage(result.message + (result.data ? '\nMissing: ' + result.data.missing.join(', ') : ''), 'bot');
                } else {
                    addMessage(result.message || 'An unexpected error occurred.', 'bot');
                }
            } catch (e) {
                chatWindow.removeChild(loadingMsg);
                addMessage('Error connecting to server. Please try again.', 'bot');
            }
        }

        sendBtn.onclick = sendMessage;
        userInput.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };
    </script>
</body>
</html>
